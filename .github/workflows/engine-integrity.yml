name: Engine source integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  protected-source-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify recovered engine and research inventory
        run: python3 engine/source_integrity.py
